#Commit 20250916-3
name: Build and Publish Core JAR
on:
  push:
    branches: [ develop ]
    paths:
      - 'core/src/main/**'
      - 'core/pom.xml'
  pull_request:
    branches: [ master ]
    paths:
      - 'core/src/main/**'
      - 'core/pom.xml'
    types: [closed]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build:
    name: Construir Artefato lncr-core
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || (github.event_name == 'push' && github.ref == 'refs/heads/develop') || github.event_name == 'workflow_dispatch'

    steps:
    - name: Fazer checkout do repositório
      uses: actions/checkout@v4

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Cache das dependências Maven
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Executar testes
      run: mvn clean test -f core/pom.xml

    - name: Construir JAR
      run: mvn clean package -f core/pom.xml -DskipTests

    - name: Obter versão do pom.xml
      id: get_version
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f core/pom.xml)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Upload JAR como artefato
      uses: actions/upload-artifact@v4
      with:
        name: lncr-core-${{ steps.get_version.outputs.version }}
        path: core/target/core-*.jar
        retention-days: 30

  publish:
    needs: build
    name: Publicar lncr-core no GitHub Packages e criar Release
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'

    steps:
    - name: Fazer checkout do repositório
      uses: actions/checkout@v4

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
        server-id: github
        server-username: GITHUB_ACTOR
        server-password: GITHUB_TOKEN

    - name: Obter versão do pom.xml
      id: get_version
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f core/pom.xml)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Verificar se pacote existe
      id: check_package
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        OWNER="${{ github.repository_owner }}"
        PACKAGE_NAME="br.com.tp.lncr.core"
        
        echo "Verificando versão existente do pacote: $VERSION"
        echo "Nome do pacote: $PACKAGE_NAME"
        echo "Proprietário: $OWNER"
        
        # Buscar versões do pacote
        echo "Buscando versões do pacote..."
        RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/orgs/$OWNER/packages/maven/$PACKAGE_NAME/versions")
        
        HTTP_STATUS=$(echo $RESPONSE | sed -E 's/.*HTTP_STATUS:([0-9]{3})$/\1/')
        BODY=$(echo $RESPONSE | sed -E 's/HTTP_STATUS:[0-9]{3}$//')
        
        echo "Status HTTP: $HTTP_STATUS"
        echo "package_exists=false" >> $GITHUB_OUTPUT
        echo "version_exists=false" >> $GITHUB_OUTPUT
        echo "version_count=0" >> $GITHUB_OUTPUT
        echo "version_id=" >> $GITHUB_OUTPUT
        
        if [ "$HTTP_STATUS" -eq 200 ]; then
          echo "package_exists=true" >> $GITHUB_OUTPUT
          
          # Contar quantas versões existem
          VERSION_COUNT=$(echo $BODY | jq length 2>/dev/null || echo "0")
          echo "Total de versões encontradas: $VERSION_COUNT"
          echo "version_count=$VERSION_COUNT" >> $GITHUB_OUTPUT
          
          # Buscar ID da versão específica
          EXISTING_VERSION_ID=$(echo $BODY | jq -r ".[] | select(.name == \"$VERSION\") | .id" 2>/dev/null || echo "")
          
          if [ ! -z "$EXISTING_VERSION_ID" ] && [ "$EXISTING_VERSION_ID" != "null" ]; then
            echo "Versão $VERSION encontrada com ID: $EXISTING_VERSION_ID"
            echo "version_exists=true" >> $GITHUB_OUTPUT
            echo "version_id=$EXISTING_VERSION_ID" >> $GITHUB_OUTPUT
          else
            echo "Nenhuma versão $VERSION encontrada"
          fi
        elif [ "$HTTP_STATUS" -eq 404 ]; then
          echo "Pacote não encontrado (primeira publicação)"
        else
          echo "Falha ao buscar versões do pacote. Status HTTP: $HTTP_STATUS"
          echo "Resposta: $BODY"
        fi

    - name: Deletar versão específica do pacote
      if: steps.check_package.outputs.version_exists == 'true' && steps.check_package.outputs.version_count != '1'
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        OWNER="${{ github.repository_owner }}"
        PACKAGE_NAME="br.com.tp.lncr.core"
        VERSION_ID="${{ steps.check_package.outputs.version_id }}"
        
        echo "Deletando versão específica $VERSION..."
        
        DELETE_RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" -X DELETE \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/orgs/$OWNER/packages/maven/$PACKAGE_NAME/versions/$VERSION_ID")
        
        DELETE_STATUS=$(echo $DELETE_RESPONSE | sed -E 's/.*HTTP_STATUS:([0-9]{3})$/\1/')
        
        if [ "$DELETE_STATUS" -eq 204 ]; then
          echo "Versão $VERSION deletada com sucesso"
        else
          echo "Falha ao deletar versão do pacote. Status HTTP: $DELETE_STATUS"
          echo "Resposta: $(echo $DELETE_RESPONSE | sed -E 's/HTTP_STATUS:[0-9]{3}$//')"
        fi

    - name: Deletar pacote completo
      if: steps.check_package.outputs.version_exists == 'true' && steps.check_package.outputs.version_count == '1'
      run: |
        OWNER="${{ github.repository_owner }}"
        PACKAGE_NAME="br.com.tp.lncr.core"
        
        echo "Esta é a única versão. Deletando pacote completo..."
        
        DELETE_RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" -X DELETE \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/orgs/$OWNER/packages/maven/$PACKAGE_NAME")
        
        DELETE_STATUS=$(echo $DELETE_RESPONSE | sed -E 's/.*HTTP_STATUS:([0-9]{3})$/\1/')
        
        if [ "$DELETE_STATUS" -eq 204 ]; then
          echo "Pacote $PACKAGE_NAME deletado com sucesso"
        else
          echo "Falha ao deletar pacote. Status HTTP: $DELETE_STATUS"
          echo "Resposta: $(echo $DELETE_RESPONSE | sed -E 's/HTTP_STATUS:[0-9]{3}$//')"
        fi

    - name: Validar configurações Maven
      run: |
        echo "Validando configuração Maven para GitHub Packages..."
        mvn help:effective-settings -f core/pom.xml | grep -A 10 -B 10 github || true

    - name: Publicar no GitHub Packages
      run: mvn deploy -f core/pom.xml -DskipTests
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Download do artefato construído
      uses: actions/download-artifact@v4
      with:
        name: lncr-core-${{ steps.get_version.outputs.version }}
        path: ./artifacts

    - name: Verificar se release existe
      id: check_release
      if: github.event.pull_request.merged == true || (github.event_name == 'push' && github.ref == 'refs/heads/master')
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        TAG_NAME="v$VERSION"
        OWNER="${{ github.repository_owner }}"
        REPO="${{ github.event.repository.name }}"
        
        echo "Verificando release existente: $TAG_NAME"
        echo "Repositório: $OWNER/$REPO"
        
        # Verificar se a release existe
        echo "Buscando informações da release..."
        RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/$OWNER/$REPO/releases/tags/$TAG_NAME")
        
        HTTP_STATUS=$(echo $RESPONSE | sed -E 's/.*HTTP_STATUS:([0-9]{3})$/\1/')
        BODY=$(echo $RESPONSE | sed -E 's/HTTP_STATUS:[0-9]{3}$//')
        
        echo "Status HTTP: $HTTP_STATUS"
        echo "release_exists=false" >> $GITHUB_OUTPUT
        echo "release_id=" >> $GITHUB_OUTPUT
        
        if [ "$HTTP_STATUS" -eq 200 ]; then
          RELEASE_ID=$(echo $BODY | jq -r '.id' 2>/dev/null || echo "")
          
          if [ ! -z "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            echo "Release $TAG_NAME encontrada com ID: $RELEASE_ID"
            echo "release_exists=true" >> $GITHUB_OUTPUT
            echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
          fi
        elif [ "$HTTP_STATUS" -eq 404 ]; then
          echo "Release não encontrada (primeira criação)"
        else
          echo "Falha ao buscar informações da release. Status HTTP: $HTTP_STATUS"
          echo "Resposta: $BODY"
        fi

    - name: Deletar release existente
      if: steps.check_release.outputs.release_exists == 'true'
      run: |
        OWNER="${{ github.repository_owner }}"
        REPO="${{ github.event.repository.name }}"
        RELEASE_ID="${{ steps.check_release.outputs.release_id }}"
        TAG_NAME="v${{ steps.get_version.outputs.version }}"
        
        echo "Deletando release existente..."
        
        DELETE_RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" -X DELETE \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/$OWNER/$REPO/releases/$RELEASE_ID")
        
        DELETE_STATUS=$(echo $DELETE_RESPONSE | sed -E 's/.*HTTP_STATUS:([0-9]{3})$/\1/')
        
        if [ "$DELETE_STATUS" -eq 204 ]; then
          echo "Release $TAG_NAME deletada com sucesso"
        else
          echo "Falha ao deletar release. Status HTTP: $DELETE_STATUS"
          echo "Resposta: $(echo $DELETE_RESPONSE | sed -E 's/HTTP_STATUS:[0-9]{3}$//')"
        fi

    - name: Verificar e deletar tag existente
      if: github.event.pull_request.merged == true || (github.event_name == 'push' && github.ref == 'refs/heads/master')
      run: |
        TAG_NAME="v${{ steps.get_version.outputs.version }}"
        OWNER="${{ github.repository_owner }}"
        REPO="${{ github.event.repository.name }}"
        
        echo "Verificando tag existente: $TAG_NAME"
        TAG_RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/$OWNER/$REPO/git/refs/tags/$TAG_NAME")
        
        TAG_HTTP_STATUS=$(echo $TAG_RESPONSE | sed -E 's/.*HTTP_STATUS:([0-9]{3})$/\1/')
        
        if [ "$TAG_HTTP_STATUS" -eq 200 ]; then
          echo "Tag $TAG_NAME encontrada - deletando..."
          
          DELETE_TAG_RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" -X DELETE \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$OWNER/$REPO/git/refs/tags/$TAG_NAME")
          
          DELETE_TAG_STATUS=$(echo $DELETE_TAG_RESPONSE | sed -E 's/.*HTTP_STATUS:([0-9]{3})$/\1/')
          
          if [ "$DELETE_TAG_STATUS" -eq 204 ]; then
            echo "Tag $TAG_NAME deletada com sucesso"
          else
            echo "Falha ao deletar tag. Status HTTP: $DELETE_TAG_STATUS"
          fi
        elif [ "$TAG_HTTP_STATUS" -eq 404 ]; then
          echo "Tag não encontrada - continuando com criação da release"
        fi

    - name: Criar Release
      if: github.event.pull_request.merged == true || (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: Release v${{ steps.get_version.outputs.version }}
        body: |
          Release automatizada para LNCR Core versão ${{ steps.get_version.outputs.version }}
          
          ## Alterações
          - Build JAR: core-${{ steps.get_version.outputs.version }}.jar
          
          ## Artefatos
        draft: false
        prerelease: false
        files: |
          ./artifacts/core-*.jar
        token: ${{ secrets.GITHUB_TOKEN }}
